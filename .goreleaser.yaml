version: 2

project_name: dcb

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: dcb
    main: ./cmd/dcb
    binary: dcb
    ldflags:
      - -s -w
      - -X github.com/JrNovaEX/DCB/pkg/version.Version={{.Version}}
      - -X github.com/JrNovaEX/DCB/pkg/version.Commit={{.Commit}}
      - -X github.com/JrNovaEX/DCB/pkg/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: dcb
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "🚀 Features"
      regexp: "^feat"
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
    - title: "⚡ Performance"
      regexp: "^perf"
    - title: "🔧 Other"

release:
  github:
    owner: JrNovaEX
    name: DCB
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
