linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - exhaustive
    - noctx

linters-settings:
  goimports:
    local-prefixes: github.com/JrNovaEX/DCB
  revive:
    rules:
      - name: exported
        severity: warning
      - name: unused-parameter
        severity: warning

issues:
  exclude-rules:
    # Test files can use unexported identifiers and have long functions.
    - path: "_test\\.go"
      linters:
        - revive
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
