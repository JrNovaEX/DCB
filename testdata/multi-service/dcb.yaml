project: fullstack
version: "3.8"

services:
  api:
    build: ./api
    port: 8080
    depends_on:
      - db
      - redis
    healthcheck: true
    env:
      NODE_ENV: development
      PORT: "8080"

  db:
    image: postgres:15-alpine
    port: 5432
    env:
      POSTGRES_DB: fullstack
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volume: pgdata:/var/lib/postgresql/data
    healthcheck: true

  redis:
    image: redis:7-alpine
    port: 6379
    healthcheck: true

  nginx:
    image: nginx:alpine
    port: 80
    depends_on:
      - api
    volume: ./nginx.conf:/etc/nginx/nginx.conf
    healthcheck: true
